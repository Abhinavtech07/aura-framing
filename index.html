<style>
body{margin:0;background:#050008;color:#fff;font-family:Arial,Helvetica,sans-serif}
.neon{color:#b56cff;text-shadow:0 0 10px #b56cff}
#loader{position:fixed;inset:0;background:#050008;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:99999}
.circle{width:180px;height:180px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;background:#1a0026}
.circle::before{content:"";position:absolute;inset:0;border-radius:50%;background: conic-gradient(#c77dff 0deg,#9d4edd var(--deg,0deg),#1a0026 0deg);mask: radial-gradient(circle at center, transparent 62%, black 63%);-webkit-mask: radial-gradient(circle at center, transparent 62%, black 63%);transition: filter 0.3s ease}
@media (prefers-reduced-motion: reduce){.circle::before{transition:none}}
.circle span{position:relative;font-size:30px;font-weight:bold}
#ad-wrapper{display:none}
.slideshow{max-width:320px;margin:20px auto}
.slide{display:none}
.slide.active{display:block}
.floating{position:fixed;bottom:20px;right:10px;z-index:9999}
.box{background:#0e0018;border:1px solid #b56cff;border-radius:12px;padding:25px;margin:20px;box-shadow:0 0 20px #7f3cff}
.btn{display:block;margin:10px 0;padding:12px;border-radius:10px;text-align:center;background:#7f3cff;color:#fff;text-decoration:none;font-weight:bold}
.share-buttons{display:flex;justify-content:center;gap:10px;margin-top:15px}
.share-buttons a{padding:8px 12px;border-radius:8px;background:#9d4edd;color:#fff;text-decoration:none;font-size:14px}
</style>
</head>
<body>

<!-- LOADER -->

  <div class="circle" id="circle"><span id="time">20</span></div>
  <div id="prep-text" style="margin-top:12px;font-size:14px;opacity:0.8">Preparing offers</div>
</div>

<!-- MAIN CONTENT -->
<div id="ad-wrapper">
<h1 class="neon" style="text-align:center">Earn With Offers</h1>

<!-- SLIDESHOW -->
<div class="slideshow">
  <div class="slide active">

  <a class="btn" href="method.html">🔥 Giant Method Website</a>
  <a class="btn" href="earn.html">💰 Refer & Earn ₹400</a>

  <div class="share-buttons">
    <a href="#" id="share-whatsapp">WhatsApp</a>

<!-- FLOATING SOCIAL BAR -->
<div class="floating">

<script>
// TIMER + CIRCLE
let total=20000,start=null;
const span=document.getElementById('time');
const circle=document.getElementById('circle');
const prepText=document.getElementById('prep-text');
function easeOutCubic(x){return 1-Math.pow(1-x,3)}
function animate(ts){
  if(!start) start=ts;
  const elapsed=ts-start;
  const raw=Math.min(elapsed/total,1);
  const progress=easeOutCubic(raw);
  span.textContent=Math.ceil((total-elapsed)/1000);
  circle.style.setProperty('--deg',(progress*360)+'deg');
  prepText.textContent='Preparing offers'+'.'.repeat(Math.floor((elapsed/500)%4));
  if(raw<1){
    requestAnimationFrame(animate);
  } else {
    document.getElementById('loader').style.display='none';
    document.getElementById('ad-wrapper').style.display='block';
  }
}
requestAnimationFrame(animate);

// SLIDESHOW
let i=0;const slides=document.querySelectorAll('.slide');
setInterval(()=>{slides[i].classList.remove('active');i=(i+1)%slides.length;slides[i].classList.add('active');},6000);

// SOFT GLOW
let glow=0,dir=1;setInterval(()=>{glow+=dir*0.5;if(glow>20||glow<10)dir*=-1;circle.style.boxShadow=`0 0 ${glow}px #b56cff`;},80);

// GEO + LINK ROTATION
const indiaLinks=['https://www.effectivegatecpm.com/eszwggg0?key=784e73c7dc4b992d827cc02a85d064b7','https://www.effectivegatecpm.com/i63pbecy1?key=6ca31a0952a0956430a016a37ca0fd57'];
const globalLinks=['https://www.effectivegatecpm.com/hte0hzu0v?key=fb45638729e3933cb3d3e10867a09592'];
fetch('https://ipapi.co/json').then(r=>r.json()).then(d=>{
 const pool=d.country_code==='IN'?indiaLinks:globalLinks;
 const link=pool[Math.floor(Math.random()*pool.length)];
 document.querySelectorAll('.btn').forEach(b=>b.href=link);
});

// MOBILE VIBRATION
if(navigator.vibrate){document.querySelectorAll('.btn').forEach(b=>{b.addEventListener('click',()=>navigator.vibrate(15));});}

// SHARE BUTTONS
const shareBtns={
  whatsapp:document.getElementById('share-whatsapp'),
  telegram:document.getElementById('share-telegram'),
  instagram:document.getElementById('share-instagram')
};
shareBtns.whatsapp.onclick=()=>{navigator.clipboard.writeText(window.location.href).then(()=>alert('Link copied for WhatsApp!'))};
shareBtns.telegram.onclick=()=>{navigator.clipboard.writeText(window.location.href).then(()=>alert('Link copied for Telegram!'))};
shareBtns.instagram.onclick=()=>{navigator.clipboard.writeText(window.location.href).then(()=>alert('Link copied for Instagram!'))};
</script>

</body>
