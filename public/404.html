<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Viral Games Hub</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1b1230 0%, #0a0d14 45%, #090b10 100%);
        color: #fff;
        font-family: Arial, sans-serif;
      }
      .card {
        text-align: center;
        max-width: 520px;
        padding: 32px 24px;
        border-radius: 24px;
        background: rgba(19, 23, 32, 0.9);
        border: 1px solid rgba(168, 85, 247, 0.45);
        box-shadow: 0 0 25px rgba(168, 85, 247, 0.2);
      }
      h1 {
        margin: 0 0 14px;
        font-size: clamp(2rem, 6vw, 3.5rem);
        letter-spacing: 0.08em;
      }
      p {
        margin: 0 0 18px;
        color: #cbd5e1;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        background: linear-gradient(90deg, #8b5cf6, #22d3ee);
        color: #050814;
        text-decoration: none;
        font-weight: 800;
        padding: 12px 18px;
        border-radius: 12px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>404</h1>
      <p>This link has drifted, but the hub is still live. Head back to the catalog and keep exploring verified ports.</p>
      <a href="/">Return Home</a>
    </div>
  </body>
</html>
